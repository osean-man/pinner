# pinner sync server behind Caddy (automatic HTTPS via Let's Encrypt).
#   cp deploy/.env.example deploy/.env   # set PINNER_DOMAIN
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  pinner-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PINNER_MAX_USERS: ${PINNER_MAX_USERS:-0}
    volumes:
      - pinner-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PINNER_DOMAIN: ${PINNER_DOMAIN:?set PINNER_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - pinner-server

volumes:
  pinner-data:
  caddy-data:
  caddy-config:
